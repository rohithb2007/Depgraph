[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "depgraph-maintainer"
version = "0.2.0"
description = "Evidence-driven dependency upgrades in disposable workspaces"
requires-python = ">=3.11"
dependencies = ["packaging>=24,<27"]

[project.optional-dependencies]
ai = ["google-genai>=1,<3"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
depgraph = "depgraph.cli:main"

[tool.setuptools.packages.find]
include = ["depgraph*"]

[tool.setuptools.package-data]
depgraph = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

